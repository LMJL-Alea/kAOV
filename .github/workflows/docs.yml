name: Build and deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pandoc (required by nbsphinx)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: Install package and doc dependencies
        run: python -m pip install --upgrade pip && pip install ".[docs]"

      - name: Debug - list installed packages
        run: pip list
        
      - name: Check that kaov is importable
        run: |
          python - <<'PY'
          import kaov
          print("kaov imported from:", kaov.__file__)
          print("public names:", sorted(n for n in dir(kaov) if not n.startswith("_")))
          PY

      - name: Build Sphinx documentation
        run: python -m sphinx -b html -T -w sphinx-warnings.log docs _build/html
      
      - name: Show Sphinx warnings
        if: always()
        run: cat sphinx-warnings.log || true
        
      - name: Fail if the API reference is empty
        run: |
          if [ ! -d _build/html/generated ] || [ -z "$(ls -A _build/html/generated)" ]; then
            echo "::error::autosummary generated no stub — the API reference is empty"
            exit 1
          fi

      - name: Disable Jekyll processing
        run: touch _build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
